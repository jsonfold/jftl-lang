name: Build and deploy docs

# Manual only — deploy deliberately when you're in a good state, after
# your own local testing (mkdocs serve). No automatic trigger on push;
# run this from the Actions tab when ready.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy
        run: mkdocs gh-deploy --force
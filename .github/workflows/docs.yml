name: Build and deploy docs

# Manual trigger — deploy deliberately, not on every push. Switch to
# `on: push: branches: [main]` later if you want it automatic once the
# doc-editing workflow settles down.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy
        run: mkdocs gh-deploy --force

    <!-- braces -->
    <path d="M226 266
             C190 266 190 296 190 328
             L190 360
             C190 393 177 407 151 416
             L151 431
             C177 440 190 454 190 487
             L190 519
             C190 551 190 582 226 582"
          fill="none" stroke="url(#braceLeft)" stroke-width="27"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M478 266
             C514 266 514 296 514 328
             L514 360
             C514 393 527 407 552 416
             L552 431
             C527 440 514 454 514 487
             L514 519
             C514 551 514 582 478 582"
          fill="none" stroke="url(#braceRight)" stroke-width="27"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- top curved connector -->
    <path d="M283 327 C320 327 321 377 361 377 C397 377 393 330 429 330"
          fill="none" stroke="#22d8ff" stroke-width="8" stroke-linecap="round"/>

    <!-- middle connector / arrow, complete -->
    <path d="M286 419 H392"
          fill="none" stroke="#28d9ff" stroke-width="9"
          stroke-linecap="round"/>
    <path d="M392 401 L422 419 L392 437 Z"
          fill="#28d9ff" stroke="#7af1ff" stroke-width="2"
          stroke-linejoin="round"/>

    <!-- bottom curved connector -->
    <path d="M283 512 C322 512 319 466 360 466 C395 466 393 511 428 511"
          fill="none" stroke="#22d8ff" stroke-width="8" stroke-linecap="round"/>

    <!-- circles -->
    <circle cx="259" cy="326" r="27" fill="url(#nodeYellow)"
            stroke="#fff36a" stroke-width="4"/>
    <circle cx="259" cy="419" r="27" fill="url(#nodeBlue)"
            stroke="#70ecff" stroke-width="4"/>
    <circle cx="259" cy="512" r="27" fill="url(#nodePurple)"
            stroke="#c692ff" stroke-width="4"/>
    <circle cx="269" cy="316" r="5" fill="#fff" opacity=".95"/>
    <circle cx="269" cy="409" r="5" fill="#fff" opacity=".9"/>
    <circle cx="269" cy="502" r="5" fill="#fff" opacity=".9"/>

    <!-- squares -->
    <rect x="427" y="306" width="48" height="48" rx="4"
          fill="url(#sqGreen)" stroke="#a9ff54" stroke-width="4"/>
    <rect x="436" y="315" width="30" height="30" rx="2" fill="#6bc81e" opacity=".85"/>

    <rect x="427" y="394" width="48" height="48" rx="4"
          fill="url(#sqOrange)" stroke="#ffd329" stroke-width="4"/>
    <rect x="436" y="403" width="30" height="30" rx="2" fill="#ff8c00" opacity=".9"/>

    <rect x="427" y="487" width="48" height="48" rx="4"
          fill="url(#sqPink)" stroke="#ff8bd3" stroke-width="4"/>
    <rect x="436" y="496" width="30" height="30" rx="2" fill="#df3b83" opacity=".9"/>
  </g>


site_name: jftl-lang
site_description: JFTL — JSON Fold Template Language, specification and guide
site_url: https://jftl-lang.dev/
repo_url: https://github.com/yairlenga/jftl-lang
repo_name: jftl-lang

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

site_name: JFTL
theme:
  name: material

nav:
  - Overview: index.md
  - Getting Started: quickstart.md
  - Reference:
      - Navigation: navigation.md
      - Logic: logic.md
      - Variables: variables.md
      - User Variables: uservars.md
      - Transformations: transform.md
      - Expression Engines: expression.md
  - Cookbook: cookbook.md
  - GitHub: https://github.com/jsonfold/jftl-lang


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
